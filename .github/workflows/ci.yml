name: EyeX CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Tests Go with race detector and coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          total="$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%", "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 50) {printf("Go coverage %.1f%% is below 50%%\n", total); exit 1} }'
      - run: go vet ./...
      - name: Coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyex-go-coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: ignore

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: |
          php -l implementations/php/public/index.php
          php -l implementations/php/simulation.php
          php -l implementations/php/v150.php

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/typescript-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: implementations/typescript-node/package-lock.json
      - run: npm ci
      - run: npm run build

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint openapi.yaml
      - name: Preserve v1 contract paths
        run: |
          for path in \
            '/api/v1/theme/types:' \
            '/api/v1/theme/{type}:' \
            '/api/v1/theme/custom:' \
            '/api/v1/test/suggest:' \
            '/api/v1/feedback:' \
            '/api/v1/simulate:' \
            '/api/v1/simulate/batch:'
          do
            grep -Fq "$path" openapi.yaml || { echo "Missing OpenAPI path: $path"; exit 1; }
          done

  vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/vue/package-lock.json
      - run: npm ci
      - run: npm run build

  legacy-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  sdk-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: sdk/react/package-lock.json
      - run: npm ci
      - run: npm run build

  sdk-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/react-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: sdk/react-native/package-lock.json
      - run: npm ci
      - run: npm run build

  sdk-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  sdk-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/flutter
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  static-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
      - run: |
          node --check frontend/html-js/assets/app.js
          node --check frontend/html-js/eyex.js
          node --check extension/browser/background.js
          node --check extension/browser/content.js
          node --check extension/browser/popup.js
      - run: python3 -m py_compile tests/parity.py tests/parity_extended.py

  parity:
    runs-on: ubuntu-latest
    needs: [go, php, typescript, java, openapi]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: implementations/typescript-node/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backends
        run: |
          (cd implementations/typescript-node && npm ci && npm run build)
          mvn -B -ntp -f implementations/java/pom.xml -DskipTests package
      - name: Extended HTTP parity across four backends
        run: |
          set -Eeuo pipefail
          mkdir -p parity-logs
          EYEX_PORT=18080 EYEX_RATE_LIMIT_PER_MINUTE=10000 go run ./cmd/api >parity-logs/go.log 2>&1 &
          GO_PID=$!
          php -S 127.0.0.1:18081 implementations/php/public/index.php >parity-logs/php.log 2>&1 &
          PHP_PID=$!
          (cd implementations/typescript-node && EYEX_PORT=18082 npm start) >parity-logs/typescript.log 2>&1 &
          TS_PID=$!
          (cd implementations/java && EYEX_PORT=18083 java -jar target/eyex-api-java-1.5.0.jar) >parity-logs/java.log 2>&1 &
          JAVA_PID=$!
          trap 'kill "$GO_PID" "$PHP_PID" "$TS_PID" "$JAVA_PID" 2>/dev/null || true' EXIT
          python3 tests/parity_extended.py --wait 120
      - name: Upload parity logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eyex-parity-logs
          path: parity-logs/*.log
          if-no-files-found: ignore

  image:
    if: github.event_name != 'pull_request'
    needs: [go, php, typescript, java, openapi, vue, legacy-web, sdk-react, sdk-react-native, sdk-ts, sdk-flutter, static-assets, parity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eyex:${{ github.sha }}
